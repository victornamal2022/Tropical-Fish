<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tablero Dinámico - Tropical Fish</title>
  <!-- Google Visualization API -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #1a2b4c; color: white; }
  </style>
</head>
<body>

  <h1>Control de Inventario - Tropical Fish</h1>

  <div class="card">
    <h2>Disponibilidad por Referencia</h2>
    <div id="table_disponibilidad">Cargando datos...</div>
  </div>

  <script type="text/javascript">
    google.charts.load('current', {'packages':['table']});
    google.charts.setOnLoadCallback(fetchData);

    const SHEET_ID = '1LeJLFf1wfxzfmMVJ7-pnMoAsX_Wac5oKxV2RRd8YKrE';
    // Nombre de la pestaña dentro del Google Sheet
    const SHEET_NAME = 'Disponibilidad'; 

    function fetchData() {
      // Consulta SQL-like usando la API de Google Visualization
      const query = new google.visualization.Query(
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_NAME}&headers=1`
      );
      
      query.send(handleQueryResponse);
    }

    function handleQueryResponse(response) {
      if (response.isError()) {
        console.error('Error al consultar datos: ' + response.getMessage());
        return;
      }

      const data = response.getDataTable();
      const table = new google.visualization.Table(document.getElementById('table_disponibilidad'));
      
      table.draw(data, {showRowNumber: false, width: '100%', height: '100%'});
    }

    // Actualización automática cada 30 segundos
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
